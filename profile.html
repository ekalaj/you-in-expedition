<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Activities — Common Ground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<header class="site">
  <div class="wrap nav">
    <a href="index.html" class="brand">
      <span class="logo" aria-hidden="true">◐</span>
      <span>Common Ground<small>Close to home</small></span>
    </a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="nav-links">☰ Menu</button>
    <nav class="nav-links" id="nav-links" aria-label="Main">
      <a href="browse.html">Find Activities</a>
      <a href="post.html">Post an Activity</a>
      <a href="pricing.html">Pricing</a>
      <a href="signup.html" data-auth-slot>Sign in</a>
    </nav>
  </div>
</header>

<main id="main">
<div class="wrap" id="content"></div>
</main>

<footer class="site">
  <div class="wrap">
    <div class="copyright">© 2026 Common Ground (working name) · This is an early prototype.</div>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
function miniCard(a) {
  const cat = categoryById(a.category);
  return `
  <article class="card">
    <div class="banner ${cat.cls}"><span class="ico" aria-hidden="true">${cat.icon}</span><span>${cat.name}</span></div>
    <div class="body">
      <h3>${a.title}</h3>
      <ul class="meta">
        <li><span class="mi" aria-hidden="true">📅</span> ${shortDate(a.date)} · ${a.time}</li>
        <li><span class="mi" aria-hidden="true">📍</span> ${a.place}, ${a.area}</li>
      </ul>
      <div class="foot">
        <span></span>
        <a class="btn btn-outline" href="activity.html?id=${a.id}">View</a>
      </div>
    </div>
  </article>`;
}

function render() {
  const me = getMember();
  const content = document.getElementById('content');

  if (!me) {
    content.innerHTML = `
      <div class="page-head"><h1>My Activities</h1></div>
      <div class="empty" style="margin-top:8px">
        <div class="big">👋</div>
        <p>You're not signed in yet.</p>
        <p style="margin-top:14px"><a class="btn btn-primary btn-lg" href="signup.html">Start free</a></p>
      </div>`;
    return;
  }

  const all = getActivities();
  const hosting = all.filter(a => a.host === me.name);
  const going = all.filter(a => a.attendees.includes(me.name) && a.host !== me.name);
  const left = trialDaysLeft();

  content.innerHTML = `
    <div class="page-head" style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
      <span class="avatar" style="width:64px;height:64px;font-size:26px">${initials(me.name)}</span>
      <div>
        <h1 style="margin:0">${me.name}</h1>
        <p style="margin:0">${me.area ? '📍 ' + me.area : 'Welcome back'}</p>
      </div>
    </div>

    <div class="notice" style="margin-top:8px;align-items:center;justify-content:space-between">
      <span>⭐ <strong>${left} day${left===1?'':'s'} left</strong> in your free trial. After that it's $10/month.</span>
      <a class="btn btn-accent" href="pricing.html" style="min-height:48px;padding:10px 20px;font-size:17px">See plans</a>
    </div>

    <section class="block" style="padding:24px 0">
      <h2 style="margin-bottom:18px">Activities you're hosting (${hosting.length})</h2>
      ${hosting.length
        ? `<div class="grid">${hosting.map(miniCard).join('')}</div>`
        : `<div class="empty"><div class="big">📌</div><p>You're not hosting anything yet.</p><p style="margin-top:14px"><a class="btn btn-primary" href="post.html">Post an activity</a></p></div>`}
    </section>

    <section class="block" style="padding:24px 0">
      <h2 style="margin-bottom:18px">Activities you're going to (${going.length})</h2>
      ${going.length
        ? `<div class="grid">${going.map(miniCard).join('')}</div>`
        : `<div class="empty"><div class="big">🗓️</div><p>You haven't joined any activities yet.</p><p style="margin-top:14px"><a class="btn btn-primary" href="browse.html">Find activities</a></p></div>`}
    </section>

    <div style="padding:20px 0 40px">
      <button id="signOut" class="btn btn-outline">Sign out</button>
    </div>
  `;

  document.getElementById('signOut').addEventListener('click', () => {
    signOut();
    toast('Signed out.');
    setTimeout(() => location.href = 'index.html', 600);
  });
}
function pageInit() { render(); }
</script>
</body>
</html>
